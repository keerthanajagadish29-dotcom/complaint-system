{% extends 'base.html' %}

{% block title %}User Registration - Complaint Management System{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-card" style="max-width: 520px;">
        <div class="auth-header">
            <i class="fa-solid fa-user-plus fa-2x mb-2"></i>
            <h4 class="fw-bold mb-0">Create New Account</h4>
            <small class="opacity-75">Register to submit and track complaints online</small>
        </div>
        <div class="auth-body">
            <form action="{{ url_for('register') }}" method="POST" id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="mobile" class="form-label fw-semibold">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" class="form-control" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="Min 6 chars" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-check-double"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" placeholder="Repeat password" required>
                        </div>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                        <i class="fa-solid fa-check-circle me-2"></i>Complete Registration
                    </button>
                </div>
            </form>

            <hr class="my-3">
            <div class="text-center">
                <p class="mb-1 text-muted">Already registered?</p>
                <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">
                    <i class="fa-solid fa-right-to-bracket me-1"></i>Sign In To Your Account
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
